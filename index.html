<body>

      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 8 12l7 7"/></svg>
    </button>

      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
    </button>
  </main>

  <div id="top-controls">
    <button id="notes-toggle" class="chrome-btn" type="button" aria-pressed="false" aria-label="Show speaker notes (N)" title="Show speaker notes (N)">

  <aside class="speaker-notes-overlay" aria-label="Speaker notes" aria-hidden="true">
    <div class="sn-header">
      <p class="sn-heading">Notes</p>
      <button class="sn-close" type="button" aria-label="Hide speaker notes">Hide notes</button>
    </div>
    <div class="sn-body" tabindex="0"></div>
  </aside>

  <div id="admin-overlay" aria-hidden="true"></div>
  <aside id="admin-panel" role="dialog" aria-modal="true" aria-labelledby="admin-title">
    <div class="admin-header">
      <h2 id="admin-title" class="admin-title">Settings</h2>
      <button id="admin-close" class="admin-close" type="button" aria-label="Close settings">Close</button>

    <div class="admin-body">
      <section class="admin-section" aria-labelledby="admin-sec-display">
        <h3 id="admin-sec-display" class="admin-section-title">Display</h3>
        <div class="admin-field">
          <label for="admin-theme">Theme</label>
          <select id="admin-theme" class="admin-select"></select>
        </div>
        <div class="admin-field">
          <label for="admin-notes">Speaker notes <span class="admin-kbd">N</span></label>
          <input id="admin-notes" class="admin-check" type="checkbox">
        </div>
        <div class="admin-field">
          <label for="admin-slide-number">Slide number</label>
          <input id="admin-slide-number" class="admin-check" type="checkbox">
        </div>
        <div class="admin-field">
          <label for="admin-section-label">Section label</label>
          <input id="admin-section-label" class="admin-check" type="checkbox">

      </section>

      <section class="admin-section" aria-labelledby="admin-sec-nav">
        <h3 id="admin-sec-nav" class="admin-section-title">Navigate &amp; export</h3>

          <div class="admin-row">

        </div>
